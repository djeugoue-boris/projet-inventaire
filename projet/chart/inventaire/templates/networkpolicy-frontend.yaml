{{- if .Values.networkPolicies.enabled }}
# 3. Ingress Controller -> frontend (8080)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "inventaire.componentName" (dict "ctx" . "component" "frontend") }}-from-ingress
  labels:
    {{- include "inventaire.labels" (dict "ctx" . "component" "network") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "inventaire.selectorLabels" (dict "ctx" . "component" "frontend") | nindent 6 }}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.networkPolicies.ingressControllerNamespace }}
    ports:
    - protocol: TCP
      port: {{ .Values.frontend.port }}
{{- end }}
