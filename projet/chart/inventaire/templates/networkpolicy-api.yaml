{{- if .Values.networkPolicies.enabled }}
# 4. API : entree depuis l'Ingress Controller et Prometheus (3000), sortie vers postgres (5432)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "inventaire.componentName" (dict "ctx" . "component" "api") }}
  labels:
    {{- include "inventaire.labels" (dict "ctx" . "component" "network") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "inventaire.selectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.networkPolicies.ingressControllerNamespace }}
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.networkPolicies.monitoringNamespace }}
    ports:
    - protocol: TCP
      port: {{ .Values.api.port }}
  egress:
  - to:
    - podSelector:
        matchLabels:
          {{- include "inventaire.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 10 }}
    ports:
    - protocol: TCP
      port: {{ .Values.postgres.port }}
{{- end }}
