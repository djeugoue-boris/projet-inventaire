{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "inventaire.fullname" . }}
  labels:
    {{- include "inventaire.labels" (dict "ctx" . "component" "ingress") | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
  - hosts:
    - {{ .Values.ingress.host }}
    secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      # Les routes de l'API commencent deja par /api : pas de reecriture.
      # /metrics n'est route vers aucun backend API : il n'est pas expose a l'exterieur.
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: {{ include "inventaire.componentName" (dict "ctx" . "component" "api") }}
            port:
              name: http
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "inventaire.componentName" (dict "ctx" . "component" "frontend") }}
            port:
              name: http
{{- end }}
