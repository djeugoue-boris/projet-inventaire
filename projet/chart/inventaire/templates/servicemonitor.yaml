{{- if .Values.monitoring.serviceMonitor.enabled }}
{{- $c := dict "ctx" . "component" "api" -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "inventaire.componentName" $c }}
  labels:
    {{- include "inventaire.labels" $c | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "inventaire.selectorLabels" $c | nindent 6 }}
  endpoints:
  - port: http
    path: /metrics
    interval: {{ .Values.monitoring.serviceMonitor.interval }}
{{- end }}
