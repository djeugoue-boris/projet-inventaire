{{- if .Values.networkPolicies.enabled }}
# 5. postgres : accepte uniquement l'API sur 5432
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "inventaire.componentName" (dict "ctx" . "component" "postgres") }}
  labels:
    {{- include "inventaire.labels" (dict "ctx" . "component" "network") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "inventaire.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 6 }}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          {{- include "inventaire.selectorLabels" (dict "ctx" . "component" "api") | nindent 10 }}
    ports:
    - protocol: TCP
      port: {{ .Values.postgres.port }}
{{- end }}
