{{- $c := dict "ctx" . "component" "api" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "inventaire.componentName" $c }}
  labels:
    {{- include "inventaire.labels" $c | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "inventaire.selectorLabels" $c | nindent 4 }}
  ports:
  - name: http
    port: {{ .Values.api.port }}
    targetPort: http
