{{- if .Values.rbac.lecteur.enabled }}
# Role en lecture seule sur le namespace (pas d'acces aux Secrets)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "inventaire.fullname" . }}-lecture-seule
  labels:
    {{- include "inventaire.labels" (dict "ctx" . "component" "rbac") | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "services", "endpoints", "configmaps", "persistentvolumeclaims", "events"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses", "networkpolicies"]
  verbs: ["get", "list", "watch"]
{{- end }}
