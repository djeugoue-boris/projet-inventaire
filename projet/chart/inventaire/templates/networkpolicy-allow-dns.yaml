{{- if .Values.networkPolicies.enabled }}
# 2. DNS pour tous les Pods du namespace (CoreDNS dans kube-system)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "inventaire.fullname" . }}-allow-dns
  labels:
    {{- include "inventaire.labels" (dict "ctx" . "component" "network") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
{{- end }}
