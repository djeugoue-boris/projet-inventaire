# Valeurs par defaut du chart inventaire (environnement de dev / demo).
# Aucune valeur n'est en dur dans les templates : tout est parametrable ici.

# Contexte de securite commun a tous les conteneurs (compatible Pod Security "restricted")
containerSecurityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault
frontend:
  replicas: 2
  image:
    repository: nginxinc/nginx-unprivileged
    tag: "1.27-alpine"
    pullPolicy: IfNotPresent
  port: 8080
  runAsUser: 101
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {memory: 64Mi}
api:
  image:
    repository: ghcr.io/djeugoue-boris/inventaire-api # mis a jour automatiquement par la CI
    tag: "bdef159cdffb8c8290d6c36e4d9cfab7aefc70ad"
    pullPolicy: IfNotPresent
  port: 3000
  runAsUser: 1000
  replicas: 2 # utilise seulement si l'autoscaling est desactive
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 256Mi}
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 60
  pdb:
    enabled: true
    minAvailable: 1
  serviceAccount:
    automountServiceAccountToken: false
  imagePullSecrets: [] # ex. [{ name: ghcr-pull }] si le package GHCR reste prive
postgres:
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  port: 5432
  database: inventaire
  user: inventaire
  storage: 1Gi
  storageClassName: "" # vide = StorageClass par defaut du cluster
  runAsUser: 999
  fsGroup: 999
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}
  # le mot de passe ne va PAS dans ce fichier : Secret cree hors du chart
  existingSecret: inventaire-postgres
  secretKey: password
ingress:
  enabled: true
  className: nginx
  host: inventaire.local
  clusterIssuer: selfsigned
  tlsSecretName: inventaire-tls
networkPolicies:
  enabled: true
  ingressControllerNamespace: ingress-nginx
  monitoringNamespace: monitoring
rbac:
  lecteur:
    enabled: true
    name: lecteur
monitoring:
  serviceMonitor:
    enabled: true
    interval: 15s
  prometheusRule:
    enabled: true
    errorRateThreshold: 0.05 # 5 % de reponses 5xx
    latencyP95Threshold: 0.5 # 500 ms
    for: 1m
