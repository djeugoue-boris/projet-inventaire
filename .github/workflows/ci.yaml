name: ci

on:
  push:
    branches: [main]
    paths: ["projet/app/**"]
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

jobs:
  build-scan-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Le nom d'image GHCR doit etre en minuscules : calcule depuis le proprietaire du depot
      - name: Nom de l'image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/inventaire-api" >> "$GITHUB_ENV"

      - name: Lint du chart Helm
        run: helm lint projet/chart/inventaire

      - name: Build
        run: docker build -t $IMAGE:${{ github.sha }} projet/app

      # Scan bloquant : le job echoue (exit-code 1) s'il reste une vulnerabilite CRITICAL corrigeable
      - name: Scan Trivy (bloquant)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image \
            --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            $IMAGE:${{ github.sha }}

      - name: Connexion a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        run: docker push $IMAGE:${{ github.sha }}

      - name: Mise a jour GitOps du tag
        run: |
          yq -i '.api.image.repository = strenv(IMAGE)' projet/chart/inventaire/values.yaml
          yq -i '.api.image.tag = "${{ github.sha }}"' projet/chart/inventaire/values.yaml
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git commit -am "ci: api ${{ github.sha }}"
          git pull --rebase
          git push
